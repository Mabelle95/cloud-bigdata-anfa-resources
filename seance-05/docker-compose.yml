# ============================================================
# Séance 05 - Cluster Spark (1 master + 2 workers) + MinIO
# Projet Anfa : lecture du référentiel via S3A, calcul de
# statistiques / heures de pointe, écriture en zone "processed"
# ============================================================

services:

  # ---------------------------------------------------------
  # MinIO : data lake (zones raw / processed)
  # ---------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - anfa-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Crée automatiquement les buckets raw / processed au démarrage
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - anfa-net
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/anfa-raw;
      mc mb -p local/anfa-processed;
      mc ls local;
      exit 0;
      "

  # ---------------------------------------------------------
  # Spark Master (image officielle Apache Spark)
  # ---------------------------------------------------------
  spark-master:
    image: apache/spark:3.5.3
    container_name: spark-master
    user: root
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077 --webui-port 8080
    ports:
      - "7077:7077"   # port maître (soumission des jobs)
      - "8080:8080"   # UI web du master
    volumes:
      - ./jobs:/opt/spark/jobs
    networks:
      - anfa-net
    depends_on:
      - minio

  # ---------------------------------------------------------
  # Spark Worker 1
  # ---------------------------------------------------------
  spark-worker-1:
    image: apache/spark:3.5.3
    container_name: spark-worker-1
    user: root
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077 --webui-port 8081 --cores 1 --memory 1G
    ports:
      - "8081:8081"   # UI web worker 1
    volumes:
      - ./jobs:/opt/spark/jobs
    networks:
      - anfa-net
    depends_on:
      - spark-master

  # ---------------------------------------------------------
  # Spark Worker 2
  # ---------------------------------------------------------
  spark-worker-2:
    image: apache/spark:3.5.3
    container_name: spark-worker-2
    user: root
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077 --webui-port 8081 --cores 1 --memory 1G
    ports:
      - "8082:8081"   # UI web worker 2
    volumes:
      - ./jobs:/opt/spark/jobs
    networks:
      - anfa-net
    depends_on:
      - spark-master

networks:
  anfa-net:
    driver: bridge

volumes:
  minio-data: